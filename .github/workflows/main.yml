name: Website Security Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run passive security audit
        env:
          TARGET_URL: https://www.mirpurcollege.edu.bd/
        run: |
          python audit.py

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-report
          path: reports/
